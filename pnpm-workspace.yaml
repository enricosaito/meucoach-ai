packages:
  - apps/*
  - packages/*
minimumReleaseAgeExclude:
  - '@anthropic-ai/sdk@0.133.0'
  - lucide-react@1.54.0
# Dependencies whose install scripts may run (true) or are deliberately skipped (false).
allowBuilds:
  unrs-resolver: false
  protobufjs: false
  inngest-cli: true
# One React type definition across apps (web runs React 19.3, Expo pins 19.2 at runtime); two
# copies make JSX types incompatible in the web app.
overrides:
  '@types/react': 19.3.0
