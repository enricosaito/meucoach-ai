name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # version comes from "packageManager" in package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  integration:
    name: Integration tests (local Supabase)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: supabase/setup-cli@v3
        with:
          version: 2.111.0
      - run: pnpm install --frozen-lockfile
      # Applies every migration from scratch, so this also verifies the migrations.
      - run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector
      - name: Verify generated DB types are up to date
        run: |
          pnpm db:types
          git diff --exit-code packages/db/src/database.types.ts
      - run: pnpm test:integration
